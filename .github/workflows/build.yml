name: Build and check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build Apple Silicon app
        run: ./build.sh
      - name: Run checks
        run: ./scripts/check.sh
      - name: Package
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NotchDeck-AppleSilicon
          path: Dist/*
